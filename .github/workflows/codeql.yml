name: CodeQL

# CodeQL advanced setup (#146): the workflows (actions) and the JS/TS source, no build needed.
# Report-only: results are code-scanning alerts and pull request annotations. Default setup must
# stay off, because it conflicts with this workflow.
on:
  pull_request:
    paths:
      - '.github/**'
      - '**/*.js'
      - '**/*.jsx'
      - '**/*.mjs'
      - '**/*.cjs'
      - '**/*.ts'
      - '**/*.tsx'
      - '**/*.mts'
      - '**/*.cts'
  # Push to master on the same paths gives pull request results a baseline.
  push:
    branches: [master]
    paths:
      - '.github/**'
      - '**/*.js'
      - '**/*.jsx'
      - '**/*.mjs'
      - '**/*.cjs'
      - '**/*.ts'
      - '**/*.tsx'
      - '**/*.mts'
      - '**/*.cts'
  schedule:
    - cron: '29 5 * * 3'
  workflow_dispatch:

permissions: {}

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze:
    name: analyze (${{ matrix.language }})
    runs-on: ubuntu-24.04
    permissions:
      actions: read # read workflow run metadata for the analysis
      contents: read # check out the repository
      security-events: write # upload results to code scanning
    strategy:
      fail-fast: false
      matrix:
        language: [actions, javascript-typescript]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Initialize CodeQL
        uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: ${{ matrix.language }}
          build-mode: none
      - name: Analyze
        uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: /language:${{ matrix.language }}
