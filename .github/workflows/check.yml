name: Check

on:
  pull_request:
  workflow_call:
    secrets:
      CONFIDENTIAL_PATTERNS:
        required: false

permissions:
  contents: read

concurrency:
  group: check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 22.23.4
          cache: npm
      - run: npm ci
      - name: Type and content check
        run: npm run check
      - name: Build
        run: npm run build
      - name: Link crawl
        run: npm run links
      - name: Tests
        run: npm test
      - name: Confidentiality gate
        run: npm run gate
        env:
          CONFIDENTIAL_PATTERNS: ${{ secrets.CONFIDENTIAL_PATTERNS }}
