name: Check

on:
  pull_request:
  workflow_call:
    secrets:
      CONFIDENTIAL_PATTERNS:
        required: false

permissions:
  contents: read

concurrency:
  group: check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 22.23.4
          cache: npm
      - run: npm ci
      - name: Type and content check
        run: npm run check
      # GITHUB_TOKEN enables the live GitHub section (src/lib/github.ts), so the gate
      # below scans the same live repo data the deploy publishes.
      - name: Build
        run: npm run build
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Link crawl
        run: npm run links
      - name: Lighthouse budget
        run: npm run lhci
      - name: Upload Lighthouse report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-report
          path: .lighthouseci/
          retention-days: 7
          include-hidden-files: true
          if-no-files-found: ignore
      - name: Tests
        run: npm test
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Confidentiality gate
        run: npm run gate
        env:
          CONFIDENTIAL_PATTERNS: ${{ secrets.CONFIDENTIAL_PATTERNS }}
