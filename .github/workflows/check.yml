name: Check

on:
  pull_request:
  workflow_call:
    secrets:
      CONFIDENTIAL_PATTERNS:
        required: false

permissions:
  contents: read

concurrency:
  group: check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        # Full history: the pearse.dev case study counts commits and merged pull requests at
        # build (#287). A shallow checkout still builds; it just omits those figures. The CV stamp
        # test dates cv.md from git log and fails under CI on a shallow clone (#289).
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22.23.4
          cache: npm
      - run: npm ci
      # The publishing runway (#128): a table of what goes out when, appended to the step summary,
      # plus ::warning lines for drafts due within 7 days. Reports only. Placed before every check
      # so an earlier failure cannot skip it, and continue-on-error so it can never block a deploy.
      - name: Publishing runway
        run: npm run runway
        continue-on-error: true
      - name: Type and content check
        run: npm run check
      # The only build of the site in CI (#150). Every later step reads this dist/; outside
      # pull requests the last step uploads it, and deploy.yml publishes that upload as is.
      # GITHUB_TOKEN enables the live GitHub section (src/lib/github.ts), so the gate below
      # scans the same live repo data that ships.
      - name: Build
        run: npm run build
        env:
          GITHUB_TOKEN: ${{ github.token }}
      # Content hash of every file in dist/, hidden ones included: the Pages upload below sets
      # include-hidden-files so /.well-known/ ships (#140), and the hash must cover what ships.
      - name: Hash dist
        id: dist-hash
        run: |
          hash=$( (cd dist && find . -type f -print0 | LC_ALL=C sort -z | xargs -0 sha256sum) | sha256sum | cut -d' ' -f1)
          echo "dist sha256 after Build: $hash"
          echo "sha256=$hash" >> "$GITHUB_OUTPUT"
      - name: Link crawl
        run: npm run links
      # Skipped on the daily scheduled rebuild (#154, ADR 0003): that run publishes date-gated
      # content, not new code, and a score just under budget must not block the day's article.
      # Under workflow_call, github.event_name is the caller's event.
      - name: Lighthouse budget
        if: github.event_name != 'schedule'
        run: npm run lhci
      - name: Upload Lighthouse report
        if: always() && github.event_name != 'schedule'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lighthouse-report
          path: .lighthouseci/
          retention-days: 7
          include-hidden-files: true
          if-no-files-found: ignore
      # Headless Chrome over dist/ from the Build step: console, view transitions, redirects,
      # 360/320 px overflow and the hero's degraded paths. The self-test proves it can fail.
      - name: Smoke self-test
        run: npm run smoke:self
      - name: Browser smoke
        run: npm run smoke
      # axe over every sitemap URL, the 404 page and /?nogl at two viewports (#151), on the same
      # dist/. Its report lands in .smoke/a11y/, so the smoke-report upload below covers it.
      - name: Accessibility scan self-test
        run: npm run a11y:self
      - name: Accessibility scan
        run: npm run a11y
        timeout-minutes: 4
      - name: Upload smoke report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: smoke-report
          path: .smoke/
          retention-days: 7
          include-hidden-files: true
          if-no-files-found: ignore
      # test:ci has no pretest hook, so the tests read the dist/ above and never rebuild it.
      - name: Tests
        run: npm run test:ci
      # Fail closed (GATE_REQUIRED=1) on push, schedule and workflow_dispatch; under
      # workflow_call (deploy.yml) this job sees the caller's event_name, so every deploy run is
      # required. Same-repo PRs not opened by Dependabot receive secrets too, so they are required
      # as well. Fork and Dependabot PRs get no secret and keep the warning. Empty vars mean unset
      # (ADR 0005 amendment). The ok line logs the pattern count.
      - name: Confidentiality gate
        run: npm run gate
        env:
          CONFIDENTIAL_PATTERNS: ${{ secrets.CONFIDENTIAL_PATTERNS }}
          GATE_REQUIRED: ${{ (github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]')) && '1' || '' }}
          CONFIDENTIAL_PATTERNS_MIN: ${{ vars.CONFIDENTIAL_PATTERNS_MIN }}
          CONFIDENTIAL_PATTERNS_SHA256: ${{ vars.CONFIDENTIAL_PATTERNS_SHA256 }}
      # Any new check goes above this step. Fails if any step since Build changed dist/.
      - name: Verify dist unchanged
        env:
          EXPECTED: ${{ steps.dist-hash.outputs.sha256 }}
        run: |
          hash=$( (cd dist && find . -type f -print0 | LC_ALL=C sort -z | xargs -0 sha256sum) | sha256sum | cut -d' ' -f1)
          echo "dist sha256 before upload: $hash"
          if [ -z "$EXPECTED" ] || [ "$hash" != "$EXPECTED" ]; then
            echo "::error::dist/ changed after Build (expected $EXPECTED, got $hash)"
            exit 1
          fi
      # Pull requests check but publish nothing. Under workflow_call the event is the
      # caller's push, schedule or dispatch, so deploy.yml runs get the github-pages artifact.
      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist
          include-hidden-files: true
